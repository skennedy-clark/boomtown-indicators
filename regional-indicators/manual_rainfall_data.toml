# regional-indicators/manual_rainfall_data.toml
#
# Manually entered monthly rainfall for towns whose published Bureau of
# Meteorology station (bom_station in towns.toml) is not in the SILO
# Patched Point Dataset. A different SILO station is not substituted,
# because continuity with the published record takes priority over
# automated availability. See fetchers/fetch_bom_rainfall.py.
#
# When a town's station is not found in SILO, fetch_bom_rainfall.py looks
# here for that town and year. Monthly figures found here go through the
# same total / summer / winter aggregation as SILO data and are labelled
# as manually sourced. If there is no entry, the fetcher reports an error
# with a link to the station's page on BOM Climate Data Online. That page
# cannot be retrieved automatically and is opened in a browser to read
# the monthly figures.
#
# A partial year may be entered; it is not counted as a complete year
# when historic averages are calculated (the same rule as for SILO data).
# Omit a month that is unknown; do not enter 0 for it.
#
# Format: one [[month]] entry per town, year and month. value_mm is in
# millimetres.
#
# [[month]]
# town          = "Moranbah"
# year          = 2025
# month         = 1
# value_mm      = 123.4
# entered_by    = "<name>"
# entered_date  = "<YYYY-MM-DD>"
# source_note   = "BOM Climate Data Online, station 034035 (Moranbah Airport)"
