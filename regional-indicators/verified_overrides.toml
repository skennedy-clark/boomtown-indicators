# regional-indicators/verified_overrides.toml
#
# Values that have been checked by hand and are to be written even though
# the write-time audit (transform/xlsx_update/audit.py) flags them.
#
# An override applies only when the value about to be written equals the
# value recorded here exactly. If the fetched value changes (a revision at
# source, a different year), the override no longer applies and the flag
# returns. An entry records that one specific figure was checked; it does
# not exempt the cell from auditing.
#
# Add an entry only after verifying the value against the original source
# or a reference document. State the kind of verification in `reason`,
# and note where the evidence is indirect (for example, corroboration
# from the --deep-audit LGA cross-check).

[[override]]
indicator     = "Non-resident workers on-shift"
sub_label     = "Non-resident workers (UCL)"
town          = "Miles"
year          = 2025
value         = 260
reason        = "Matches the hand-compiled 2026 reference workbook exactly"
verified_date = "2026-09-15"

[[override]]
indicator     = "Non-resident workers on-shift"
sub_label     = "Non-resident workers (UCL)"
town          = "Wandoan"
year          = 2025
value         = 145
reason        = "Matches the hand-compiled 2026 reference workbook exactly"
verified_date = "2026-09-15"

# Entry template:
#
# [[override]]
# indicator     = "<row name>"
# sub_label     = "<column B sub-label>"
# town          = "<town>"
# year          = <year>
# value         = <value exactly as fetched>
# reason        = "<how the value was verified>"
# verified_date = "<YYYY-MM-DD>"
