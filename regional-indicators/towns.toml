# towns.toml
# Configuration for all towns tracked in the indicators project.
#
# Fields:
#   name            - Display name used in output CSVs and reports
#   state           - Australian state abbreviation
#   postcode        - Primary postcode (used for ATO income data)
#   postcodes       - All postcodes to aggregate (some towns span multiple)
#   sa2_code        - ABS ASGS Edition 3 (2021) SA2 code — used by SALM unemployment fetcher
#   sa2_name        - Official ABS SA2 name (may differ slightly from display name)
#   sa3_code        - Parent SA3 code
#   lga             - Local Government Area name
#   qps_division    - QLD Police Service division (QLD towns only)
#   csg_notice_year - Year CSG development was first noticed locally (if applicable)
#   benchmark       - If true, used as state benchmark (not a study town)
#   notes           - Any data quirks or boundary notes
#
# SA2 code history:
#   All sa2_code values are ASGS 2021 Edition 3 (effective Jul 2021–Jun 2026).
#   The 2021 restructure renumbered and renamed many western QLD SA2s relative
#   to ASGS 2016. Original 2016 codes are noted in town comments where changed.
#   qgso_sa2 is retained as a separate field for QGSO-specific lookups and may
#   differ from sa2_code where QGSO uses a different aggregation boundary.
#
# SALM coverage notes:
#   DEWR excludes SA2s with insufficient statistical reliability from the SALM
#   smoothed dataset. The following towns have no SA2-level SALM data and use
#   a proxy SA2 or are skipped pending an LGA-level fallback:
#     Dalby      → proxy: Wambo (307021183); Dalby SA2 absent from SALM
#     Dysart     → proxy: Broadsound - Nebo (312011338); Dysart merged in ASGS 2021
#     Narrabri   → absent from SALM; LGA fallback TBD
#     Shepparton → absent from SALM; LGA fallback TBD
#     Yarram     → absent from SALM; LGA fallback TBD

[settings]
output_dir  = "3 Web Content"
raw_dir     = "raw"
staging     = true          # write to staging/ before overwriting live CSVs
asgs_edition = 2021         # ABS geography edition in use

