# regional-indicators/towns.toml
#
# Towns and benchmark regions covered by the indicators project. Read by
# config.py; every fetcher, writer and booklet builder takes its geography
# from this file.
#
# Fields (all optional except name and state):
#   name             display name; matches the town headings in the workbook
#   state            QLD, NSW or VIC; fetchers skip states they do not cover
#   postcode(s)      primary postcode, and all postcodes for the town
#   sa2_code         ABS SA2 code (ASGS 2021)
#   sa2_name         SA2 name as it appears in the workbook's row labels
#   sa3_code         ABS SA3 code (ASGS 2021)
#   qgso_sa2         SA2 code used in QGSO regional database (QRSIS) queries
#   qgso_lga         LGA code in QRSIS form ("LGA/<ABS LGA code>")
#   lga              LGA name; matches the LGA block labels in the workbook
#   lga_code         ABS LGA code, for towns that have no qgso_lga
#   qps_division     Queensland Police Service division used for crime rates
#   bom_station      Bureau of Meteorology station number for rainfall
#   locality         locality name in suburb-level tables (Victoria: the median house
#                    price from Valuer-General Victoria); omit to leave that row blank
#   csg_notice_year  CSG notice year for the town (not currently used by the code)
#   benchmark        true for comparison regions (see BENCHMARKS below)
#   district         text shown on the booklet title page
#   cover_photo      file name in resources/images/towns/<slug>/
#   sa2_map_url      QGSO SA2 boundary map (PDF) used for the booklet map page
#   notes            free text; not used by the code
#
# The table key ([towns.<slug>]) is used for folder and file names.

[settings]
output_dir   = "3 Web Content"
raw_dir      = "raw"
staging      = true
asgs_edition = 2021


