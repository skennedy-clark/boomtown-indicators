# ─────────────────────────────────────────────
# DATA SOURCE CONFIGURATION
# Per-source settings used by the fetch scripts
# ─────────────────────────────────────────────

[sources.ato]
# ATO Taxation Statistics - individual income by postcode
# Latest available: 2022-23 (released mid-2024); lags ~18 months
base_url       = "https://www.ato.gov.au/about-ato/research-and-statistics/in-detail/taxation-statistics/"
table          = "Table 8"   # Median and average taxable income by postcode
latest_year    = "2022-23"
lag_years      = 2
notes          = "Download Table 8 xlsx manually or via direct link; filter by postcode"

[sources.abs_erp]
# ABS Estimated Resident Population - national, by SA2
# Updated annually, usually released ~12 months after reference year
api_url        = "https://api.data.abs.gov.au/data/ABS,ERP_ASGS2021,1.0.0/"
latest_year    = 2023
notes          = "Use ABS Data Explorer API; filter by SA2 code"

[sources.abs_labour]
# ABS Small Area Labour Markets - unemployment by SA2
# Quarterly; most recent usually 2-3 quarters behind
api_url        = "https://api.data.abs.gov.au/data/ABS,SALM_ASGS2021,1.0.0/"
notes          = "National source - works for QLD, NSW and VIC towns equally"

[sources.qgso_housing]
# QGSO Regional Database - house prices, rent, building approvals
# QLD only; accessed via web form (semi-automated)
base_url       = "https://statistics.qgso.qld.gov.au/report-viewer/run"
states         = ["QLD"]
notes          = "Requires browser interaction to select region and download; semi-automated only"

[sources.qps_crime]
# Queensland Police Service crime statistics
# Annual; financial year basis; downloadable CSV
base_url       = "https://www.police.qld.gov.au/maps-and-statistics"
states         = ["QLD"]
latest_year    = "2023-24"
notes          = "CSV download available by police division; must map SA2/town to QPS division"

[sources.vicpol_crime]
# Victoria Police crime statistics
# Annual; calendar year basis
base_url       = "https://www.crimestatistics.vic.gov.au/crime-statistics/latest-victorian-crime-data/download-data"
states         = ["VIC"]
notes          = "Different geography (LGA/suburb) and year basis to QPS; needs mapping"

[sources.bom_rainfall]
# Bureau of Meteorology - rainfall by station
# National; near real-time
base_url       = "http://www.bom.gov.au/climate/data/"
api_url        = "http://www.bom.gov.au/jsp/ncc/cdio/weatherData/av"
notes          = "Use station ID per town; Roma = station 043091 (Roma Airport)"

[sources.fuel_prices]
# Fuel prices - RULP (regular unleaded)
# Source TBD - original booklets cited source unclear
# Options: ACCC quarterly monitoring, state fuel price portals
base_url       = "https://www.accc.gov.au/consumers/petrol-and-fuel/petrol-price-cycles"
notes          = "ACCC data is metro/capital city focused; regional town data harder to source automatically"
