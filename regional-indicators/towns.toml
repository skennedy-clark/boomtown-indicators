# towns.toml
# Configuration for all towns tracked in the indicators project.
#
# Fields:
#   name            - Display name used in output CSVs and reports
#   state           - Australian state abbreviation
#   postcode        - Primary postcode (used for ATO income data)
#   postcodes       - All postcodes to aggregate (some towns span multiple)
#   sa2_code        - ABS ASGS Edition 3 (2021) SA2 main code
#   sa2_name        - Official ABS SA2 name (may differ slightly from display name)
#   sa3_code        - Parent SA3 code
#   lga             - Local Government Area name
#   qps_division    - QLD Police Service division (QLD towns only)
#   csg_notice_year - Year CSG development was first noticed locally (if applicable)
#   benchmark       - If true, used as state benchmark (not a study town)
#   notes           - Any data quirks or boundary notes

[settings]
output_dir  = "3 Web Content"
raw_dir     = "raw"
staging     = true          # write to staging/ before overwriting live CSVs
asgs_edition = 2021         # ABS geography edition in use

