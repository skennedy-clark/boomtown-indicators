# towns.toml
# Configuration for all towns tracked in the indicators project.
# Auto-updated from uploaded towns.toml — April 2026
#
# BOOKLET FIELDS (added for booklet generation):
#   slug         - used as folder name and Python identifier
#   district     - text shown on booklet title page
#   cover_photo  - filename in resources/images/towns/{slug}/

[settings]
output_dir   = "3 Web Content"
raw_dir      = "raw"
staging      = true
asgs_edition = 2021


