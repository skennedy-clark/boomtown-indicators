[project]
name = "boomtown-indicators"
version = "0.1.0"
description = "Data pipeline for the UQ Centre for Natural Gas regional indicators project"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "beautifulsoup4",
    "pandas",
    "openpyxl",
    "xlwings",  # workbook writers (transform/xlsx_update/). The workbook is
                # edited through Excel itself because openpyxl cannot
                # round-trip it (see transform/xlsx_update/base.py).
                # Requires Microsoft Excel (Windows or macOS).
    "lxml",
    "pypdfium2",
    "Pillow",
    "python-docx",
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-mock",
    "responses",
]
geo = [
    "duckdb",       # fetchers/fetch_sa2.py, fetchers/fetch_qld_tenure.py
]
maps = [
    "geopandas",    # assemble_maps/postcode_plot.py
    "matplotlib",
    "contextily",
]

# No [build-system] table is declared: regional-indicators/ is not an
# importable package (its name contains a hyphen), and the scripts add it to
# sys.path themselves. This file declares the dependencies and configures
# pytest.

[tool.pytest.ini_options]
# Tests import the pipeline modules (config, logger, fetchers, ...) in the
# same way the scripts do.
pythonpath = ["regional-indicators"]
testpaths = ["tests"]